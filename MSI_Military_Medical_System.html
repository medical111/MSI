const Badge = ({ color, children }) => {
  const colors = {
    green: { bg: "#e6f9f0", text: "#0a7a4b", border: "#9fe1cb" },
    red: { bg: "#fcebeb", text: "#a32d2d", border: "#f09595" },
    yellow: { bg: "#faeeda", text: "#854f0b", border: "#fac775" },
    blue: { bg: "#e6f1fb", text: "#185fa5", border: "#85b7eb" },
    gray: { bg: "#f1efe8", text: "#5f5e5a", border: "#b4b2a9" },
    teal: { bg: "#e1f5ee", text: "#0f6e56", border: "#5dcaa5" },
  };
  const c = colors[color] || colors.gray;
  return (
    <span style={{ background: c.bg, color: c.text, border: `1px solid ${c.border}`, borderRadius: 20, padding: "2px 10px", fontSize: 12, fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 4 }}>

};
